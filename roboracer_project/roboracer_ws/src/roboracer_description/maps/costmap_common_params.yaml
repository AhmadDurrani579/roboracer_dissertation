costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: true
  rolling_window: false
  width: 100.0
  height: 100.0
  resolution: 0.05
  plugins: ["obstacle_layer", "inflation_layer"]

  obstacle_layer:
    enabled: true
    max_obstacle_height: 1.0
    min_obstacle_height: 0.0
    obstacle_range: 5.0
    raytrace_range: 5.5
    observation_sources: scan map
    scan:
      topic: /scan
      data_type: LaserScan
      marking: true
      clearing: true
      inf_is_valid: false
      expected_update_rate: 10.0  # Ensure LiDAR updates are frequent
    map:
      topic: /map
      data_type: OccupancyGrid
      marking: true
      clearing: false
      occupied_threshold: 0.5  # Lowered to ensure purple lines are obstacles
      free_threshold: 0.1      # Adjusted for map interpretation

  inflation_layer:
    enabled: true
    inflation_radius: 0.5
    cost_scaling_factor: 5.0